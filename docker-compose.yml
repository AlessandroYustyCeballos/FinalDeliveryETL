x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'

    _PIP_ADDITIONAL_REQUIREMENTS: >-
      pandas requests yfinance finnhub-python websocket-client
      great_expectations
      kafka-python psycopg2-binary sqlalchemy
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./preparar.py:/opt/airflow/preparar.py
    - ./Save.py:/opt/airflow/Save.py
    - ./Utils:/opt/airflow/Utils
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # Postgres 
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_pass
      POSTGRES_DB: trading_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d   # ejecuta init_schema.sql al primer arranque
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "etl_user", "-d", "trading_db"]
      interval: 10s
      retries: 5

  #  Postgres Airflow 
  airflow-db:
    image: postgres:15
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # Kafka stack 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  #  Airflow 
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy

  #  Metabase 
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: etl_user
      MB_DB_PASS: etl_pass
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      retries: 10
      start_period: 60s

  # stream Finnhub WebSocket 

  finnhub-stream:
    image: python:3.11-slim
    container_name: finnhub-stream
    working_dir: /opt/airflow
    volumes:
      - ./Utils:/opt/airflow/Utils
      - ./Save.py:/opt/airflow/Save.py
      - ./data:/opt/airflow/data
    environment:
      AIRFLOW_HOME: /opt/airflow
      FOREX_SYMBOL: "${FOREX_SYMBOL:-EURUSD=X}"
      PYTHONUNBUFFERED: "1"
    command: >-
      bash -c "pip install --quiet websocket-client pandas finnhub-python yfinance requests &&
               python -u -c 'from Utils.Request import Finhub; Finhub(\"${FOREX_SYMBOL:-EURUSD=X}\")'"
    restart: unless-stopped

  #  Kafka Producer
  producer:
    image: python:3.11-slim
    container_name: producer
    working_dir: /app
    volumes:
      - ./app:/app
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TRADING_DB_URI: postgresql+psycopg2://etl_user:etl_pass@postgres:5432/trading_db
      PRODUCER_DELAY: "1.0"
      PRODUCER_POLL_INTERVAL: "10.0"
      PYTHONUNBUFFERED: "1"  
    command: >-
      bash -c "pip install --quiet kafka-python pandas psycopg2-binary sqlalchemy &&
               python -u producer.py"
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  #  Streamlit 
  streamlit:
    image: python:3.11-slim
    container_name: streamlit
    working_dir: /app
    volumes:
      - ./app:/app
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: quotes_stream
      BUFFER_SIZE: "2000"
      AUTO_REFRESH: "2.0"
    command: >-
      bash -c "pip install --quiet streamlit kafka-python pandas plotly &&
               streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501"
    ports:
      - "8501:8501"
    depends_on:
      - kafka
      - postgres

volumes:
  postgres_data:
    external: true
    name: etl-proyect-main_postgres_data
  airflow_db_data:
    external: true
    name: etl-proyect-main_airflow_db_data
  metabase_data:
    external: true
    name: etl-proyect-main_metabase_data